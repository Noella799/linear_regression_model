[project]
name = "pciat-regression"
version = "0.1.0"
description = "Predicting problematic internet use (PCIAT score) in children - regression model, FastAPI service and Flutter app"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn==1.9.1",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "ipykernel>=6.29",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
